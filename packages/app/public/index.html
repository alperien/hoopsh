<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hoopsh gm</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div id="frame">
  <aside id="rail">
    <div class="wordmark">hoopsh gm<small id="league-tag">the Association</small></div>
    <nav id="nav"></nav>
    <div class="rail-note" id="rail-note"></div>
  </aside>
  <div id="main">
    <header id="masthead">
      <div class="date"><b id="mh-date">...</b><span id="mh-phase-label"></span></div>
      <div class="record">record <b id="mh-record">-</b> <span id="mh-seed"></span></div>
      <div id="mh-tonight"></div>
      <div class="spacer"></div>
      <span class="phase-chip" id="mh-phase"></span>
      <button class="quiet" id="btn-save" title="save (s)">save</button>
      <button id="btn-advance" title="advance one day (a)">advance day</button>
      <button id="btn-advance-week" title="sim to the next thing that needs you (w)">sim ahead</button>
    </header>
    <main id="content"></main>
    <div id="keys">
      <span><b>a</b> advance</span><span><b>w</b> sim ahead</span><span><b>s</b> save</span>
      <span><b>o</b> office</span><span><b>r</b> roster</span><span><b>l</b> league</span>
      <span><b>t</b> trade</span><span><b>n</b> news</span>
    </div>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="/js/boot.js"></script>
</body>
</html>
