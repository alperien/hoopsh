# The verification ladder — with teeth.
#
# Two jobs:
#   verify — zero-install by design: the repo runs on Node 24's native type
#            stripping (tools/register.mjs + hooks), so nothing here needs
#            npm install. Tests, gated acceptance bands, determinism (the
#            fingerprint corpus double-built in-process, plus a two-process
#            stdout diff), and docs drift. Since issue #33 the checked-in
#            golden corpus is NOT compared here — gameplay regressions are
#            gated by the bands + the invariant suite, which survive
#            rng-order changes; the golden file serves the pure-refactor
#            tier's local byte-identity assertion (npm run fingerprint).
#   types  — the one job that DOES install: `tsc --noEmit` (strict +
#            noUncheckedIndexedAccess) and the same suites under real vitest.
#            Until this job existed the TypeScript in this repo had never been
#            typechecked anywhere (the authoring environment had no registry
#            access) — the strict flags in tsconfig were unverified claims.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: test suite (invariants, archetypes, wide-band guard, fidelity gate)
        run: npm test
      - name: acceptance bands (48 games, gated — exits nonzero below the ratchet floor)
        # 48 games is where the band count is stable (at 24 several boundary
        # bands flicker; see REFACTOR.md). The pass/fail floor lives in cli.ts
        # as RATCHET_FLOOR next to the measurements that justify it.
        run: npm run batch -- --games 48
      - name: fingerprint determinism (28 seeds, two in-process corpus builds must match)
        # Determinism-only since issue #33: this builds the corpus twice in
        # one process and compares run-to-run — it does NOT read the golden
        # file. An rng-order change legitimately moves every golden hash, so
        # a golden diff cannot tell a regression from an allowed change; the
        # gameplay gates are the bands step above and the invariant suite in
        # npm test. Catches module state leaking across simulateGame calls;
        # the two-process diff below catches process-stable ambient state.
        run: npm run fingerprint:determinism
      - name: sim stdout determinism (two processes must match)
        # normalize the wall-clock timing line — the SIMULATION is
        # deterministic, the "simulated in Xms" stopwatch is not (run #1
        # failed on exactly this)
        run: |
          npm run sim -- --seed ci-fp | sed 's/simulated in [0-9]*ms/simulated in Xms/' > /tmp/fp1.txt
          npm run sim -- --seed ci-fp | sed 's/simulated in [0-9]*ms/simulated in Xms/' > /tmp/fp2.txt
          diff /tmp/fp1.txt /tmp/fp2.txt
      - name: docs drift (BIBLE.md must regenerate to zero diff)
        run: |
          npm run docs:bible
          git diff --exit-code docs/BIBLE.md

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install dev toolchain (typescript, vitest)
        # no lockfile by design (zero-install repo) — plain install
        run: npm install --no-audit --no-fund
      - name: typecheck (strict + noUncheckedIndexedAccess)
        run: npm run typecheck
      - name: test suite under real vitest (same files, real matchers)
        run: npm run test:vitest
